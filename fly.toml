# Fly.io: one machine, games live in memory. See mcp/DEPLOY.md.
app = "robrotaxi-hq"
primary_region = "iad"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "3s"

[[mounts]]
  source = "robrotaxi_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
